    :root {
      --bg: #000000;
      --bg2: #000000;
      --black: #000000;
      --white: #FFFFFF;
      --soft: rgba(255,255,255,.74);
      --red: #E31837;
      --orange: #F58220;
      --yellow: #FFC20E;
      --cyan: #00CFE8;
      --blue-dark: #075B78;
      --silver: #D9E2E5;
      --blue-electric: #008CFF;
      --line: rgba(255,255,255,.18);
      --glass: rgba(255,255,255,.075);
      --shadow: 0 24px 80px rgba(0,0,0,.62);
      --ease: cubic-bezier(.2,.8,.2,1);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
      color: var(--white);
      background: var(--bg);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, [role="button"] { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; }
    :focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 4px;
    }

    .scene {
      position: relative;
      isolation: isolate;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(227,24,55,.2), transparent 43%),
        radial-gradient(ellipse at 15% 12%, rgba(245,130,32,.12), transparent 27%),
        linear-gradient(150deg, #000000 0%, #000000 57%, #000000 100%);
    }
    .scene::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.2) 0 1px, transparent 1.5px),
        radial-gradient(circle at 75% 70%, rgba(255,194,14,.15) 0 1px, transparent 1.5px);
      background-size: 83px 91px, 117px 107px;
      mix-blend-mode: screen;
    }
    .scene::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 70vmax;
      height: 70vmax;
      left: 50%;
      top: 39%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(227,24,55,.14), transparent 68%);
      pointer-events: none;
      animation: breathe 8s ease-in-out infinite;
    }
    .scene.is-open::after { opacity: .38; }
    .stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(255,255,255,.64);
      box-shadow: 0 0 12px rgba(255,255,255,.65);
      animation: twinkle var(--twinkle, 4s) ease-in-out infinite alternate;
    }
    .topbar {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100% - 36px, 1100px);
      margin: 0 auto;
      padding: 28px 0 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--white);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .brand-logo {
      display: block;
      flex: 0 0 auto;
      width: 108px;
      height: 36px;
      object-fit: contain;
      object-position: left center;
    }
    .brand-mark {
      position: relative;
      width: 21px;
      height: 21px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 50%;
    }
    .brand-mark::before, .brand-mark::after {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid var(--red);
      border-radius: 50% 0 50% 50%;
      transform: rotate(45deg);
    }
    .brand-mark::after { transform: rotate(225deg); border-color: var(--yellow); }
    .counter {
      display: flex;
      align-items: baseline;
      gap: 7px;
      color: var(--soft);
      font-size: .7rem;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .counter strong {
      color: var(--white);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: .04em;
    }

    .intro {
      position: relative;
      z-index: 2;
      width: min(100% - 36px, 1100px);
      margin: clamp(24px, 5vh, 58px) auto 0;
      text-align: center;
      animation: rise .9s var(--ease) both;
    }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--yellow);
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: .34em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.5rem, 9vw, 6.2rem);
      font-weight: 400;
      letter-spacing: -.055em;
      line-height: .96;
      text-wrap: balance;
    }
    .intro-note {
      max-width: 300px;
      margin: 17px auto 0;
      color: var(--soft);
      font-size: .88rem;
      line-height: 1.65;
    }

    .bouquet-stage {
      position: relative;
      width: min(100%, 620px);
      height: min(76vw, 445px);
      min-height: 320px;
      margin: clamp(20px, 3vh, 35px) auto 0;
      animation: rise 1.1s .12s var(--ease) both;
    }

    .halo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 74%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -46%);
      background: radial-gradient(circle, rgba(227,24,55,.13), rgba(245,130,32,.09) 34%, transparent 67%);
      filter: blur(3px);
    }
    .bouquet {
      position: absolute;
      inset: 0;
      transform-origin: 50% 80%;
      transition: transform 1.1s var(--ease), filter 1.1s var(--ease);
    }
    .scene.finale-ready .bouquet { animation: bouquet-finale 2.4s var(--ease) both; }
    .paper {
      position: absolute;
      z-index: 1;
      left: 50%;
      bottom: 4%;
      width: 39%;
      height: 46%;
      transform: translateX(-50%) rotate(4deg);
      clip-path: polygon(7% 0, 93% 0, 69% 100%, 31% 100%);
      background: linear-gradient(118deg, rgba(227,24,55,.2), rgba(255,255,255,.08) 44%, rgba(0,0,0,.24));
      border: 1px solid rgba(255,255,255,.17);
      box-shadow: inset 0 0 25px rgba(255,255,255,.08), 0 16px 24px rgba(0,0,0,.26);
      backdrop-filter: blur(6px);
    }
    .paper::before {
      content: "";
      position: absolute;
      inset: 0 18% 0 0;
      clip-path: inherit;
      background: rgba(255,255,255,.06);
    }
    .ribbon {
      position: absolute;
      z-index: 7;
      left: 50%;
      bottom: 14%;
      width: 51px;
      height: 34px;
      transform: translateX(-50%);
    }
    .ribbon::before, .ribbon::after {
      content: "";
      position: absolute;
      bottom: 2px;
      width: 23px;
      height: 27px;
      border: 1px solid rgba(227,24,55,.7);
      background: linear-gradient(135deg, rgba(227,24,55,.68), rgba(245,130,32,.4));
    }
    .ribbon::before { left: 1px; clip-path: polygon(0 0, 100% 12%, 74% 100%, 42% 76%); transform: rotate(13deg); }
    .ribbon::after { right: 1px; clip-path: polygon(0 12%, 100% 0, 58% 76%, 26% 100%); transform: rotate(-13deg); }
    .ribbon span {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 1px;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255,255,255,.62);
      border-radius: 50%;
      transform: translateX(-50%);
      background: var(--red);
      box-shadow: 0 2px 12px rgba(227,24,55,.45);
    }

    .stem {
      position: absolute;
      z-index: 2;
      display: none;
      bottom: 15%;
      left: 50%;
      width: 2px;
      height: 57%;
      transform-origin: bottom center;
      background: linear-gradient(var(--orange), rgba(245,130,32,.3));
      box-shadow: 0 0 7px rgba(245,130,32,.34);
    }
    .stem::before, .stem::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 10px;
      border: 1px solid rgba(245,130,32,.72);
      border-radius: 100% 0 100% 0;
      background: rgba(245,130,32,.19);
    }
    .stem::before { top: 48%; left: -21px; transform: rotate(-29deg); }
    .stem::after { top: 65%; left: 1px; transform: rotate(25deg) scaleX(-1); }
    .stem.s1 { transform: translateX(-50%) rotate(-28deg); height: 61%; }
    .stem.s2 { transform: translateX(-50%) rotate(-19deg); height: 70%; }
    .stem.s3 { transform: translateX(-50%) rotate(-9deg); height: 66%; }
    .stem.s4 { transform: translateX(-50%) rotate(3deg); height: 75%; }
    .stem.s5 { transform: translateX(-50%) rotate(15deg); height: 69%; }
    .stem.s6 { transform: translateX(-50%) rotate(26deg); height: 59%; }
    .stem.s7 { transform: translateX(-50%) rotate(35deg); height: 51%; }
    .stem.s8 { transform: translateX(-50%) rotate(7deg); height: 63%; }

    @keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(.95); opacity: .7; } 50% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; } }
    @keyframes twinkle { from { opacity: .25; transform: scale(.7); } to { opacity: .95; transform: scale(1.35); } }
    @keyframes car-in { from { transform: translate(-50%, 135px) scale(.72); } 64% { transform: translate(-50%, -3px) scale(1); } 100% { transform: translate(-50%, 0) scale(1); } }
    @keyframes car-out { from { transform: translate(-50%, 0) scale(1); opacity: 1; } to { transform: translate(92vw, 30px) scale(.72); opacity: 0; } }
    @keyframes bouquet-finale { 0% { transform: scale(1) rotate(0); } 30% { transform: scale(1.06) rotate(-2deg); } 68% { transform: scale(1.09) rotate(2deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes orbit-car { 0% { opacity: 0; transform: translate(0, 40px) rotate(-12deg) scale(.7); } 20%, 75% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--travel-x, 18px), var(--travel-y, -30px)) rotate(15deg) scale(1); } }
    @keyframes fall { 0% { opacity: 0; transform: translate3d(0, -20px, 0) rotate(0deg); } 12% { opacity: .85; } 100% { opacity: 0; transform: translate3d(var(--drift), 110vh, 0) rotate(480deg); } }

    @media (min-width: 700px) {
      .topbar { padding-top: 38px; }
      .intro { margin-top: 38px; }
      .bouquet-stage { height: min(52vw, 500px); margin-top: 24px; }
      .flower { width: 82px; height: 82px; }
      .flower .petal { width: 36px; height: 50px; }
      .flower-2 .petal, .flower-4 .petal { width: 31px; height: 51px; }
      .flower-3 .petal, .flower-7 .petal { width: 42px; height: 42px; }
      .flower-6 .petal { width: 23px; height: 51px; }
      .message-card { bottom: 38px; }
      .intro-note { max-width: 380px; }
    }
    @media (max-height: 700px) and (max-width: 699px) {
      .topbar { padding-top: 18px; }
      .intro { margin-top: 14px; }
      .intro-note { margin-top: 10px; }
      .bouquet-stage { margin-top: 4px; height: 320px; min-height: 280px; }
      .hint { margin-top: -4px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

        car.classList.add("is-returning");
        later(function () {
          resetCar(0);
          flowers.forEach(function (flower) { flower.classList.remove("is-active"); });
        }, 1150);
      }
      function openFlower(number) {
        var index = number - 1;
        clearTimers();
        var flower = flowers[index];
        flowers.forEach(function (item) { item.classList.remove("is-active"); });
        flower.classList.add("is-active");
        if (!discovered[number]) {
          discovered[number] = true;
          flower.classList.add("is-discovered");
          var total = updateCounter();
          if (total === 8 && !finalUnlocked) flashStatus("El ramo está completo");
        }
        messageEl.textContent = messages[index];
        flowerLabel.textContent = "Flor " + number + " de 8";
        scene.classList.add("is-open");
        card.classList.remove("is-visible");
        resetCar(index);
        car.classList.add("is-driving");
        later(function () { card.classList.add("is-visible"); }, reduced ? 10 : 720);
        later(function () { card.classList.remove("is-visible"); }, 5100);
        later(function () {
          car.classList.remove("is-driving");
          car.classList.add("is-returning");
        }, 5300);
        later(function () {
          resetCar(index);
          scene.classList.remove("is-open");
          flower.classList.remove("is-active");
          if (Object.keys(discovered).length === 8 && !finalUnlocked) unlockFinal();
        }, 6500);
      }
      function unlockFinal() {
        finalUnlocked = true;
        scene.classList.add("finale-ready");
        createPetals(22);
        createFleet();
        fleet.classList.add("show");
        petalRain.classList.add("show");
        later(function () {
          finale.classList.add("is-visible");
          later(function () {
            finalCopy.classList.add("is-revealed");
            finalButton.classList.add("is-revealed");
          }, 2100);
        }, 1200);
        later(function () {
          fleet.classList.remove("show");
          petalRain.classList.remove("show");
        }, 3900);
      }
      function ultimateReveal() {
        clearTimers();
        finalTitle.textContent = "Y si llegaste hasta aquí...";
        finalCopy.textContent = "Gracias por formar parte de una historia que vale la pena recordar.";
        finalCopy.classList.add("is-revealed");
        finalButton.classList.remove("is-revealed");
        finale.classList.add("ultimate");
        scene.classList.add("finale-ready");
        createPetals(42);
        createFleet();
        fleet.classList.add("show");
        petalRain.classList.add("show");
        later(function () {
          finalCopy.innerHTML = "Gracias por formar parte de una historia que vale la pena recordar.<br><br><strong>Con cariño.</strong>";
        }, 500);
        later(function () {
          fleet.classList.remove("show");
          petalRain.classList.remove("show");
        }, 5200);
      }
      function replay() {
        clearTimers();
        finale.classList.remove("is-visible", "ultimate");
        finalCopy.classList.remove("is-revealed");
        finalButton.classList.remove("is-revealed");
        finalTitle.textContent = "Has encontrado todas las historias.";
        finalCopy.textContent = "Pero falta una...";
        fleet.classList.remove("show");
        petalRain.classList.remove("show");
        scene.classList.remove("finale-ready");
        finalUnlocked = false;
        discovered = {};
        countEl.textContent = "0";
        flowers.forEach(function (flower) { flower.classList.remove("is-discovered", "is-active"); });
        flashStatus("El ramo vuelve a esperarte");
      }
      flowers.forEach(function (flower) {
        flower.addEventListener("click", function () { openFlower(Number(flower.dataset.flower)); });
        flower.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openFlower(Number(flower.dataset.flower));
          }
        });
      });
      document.getElementById("closeCard").addEventListener("click", closeMessage);
      finalButton.addEventListener("click", ultimateReveal);
      replayButton.addEventListener("click", replay);
      createStars();
    }());
  </script>
</body>
</html>
